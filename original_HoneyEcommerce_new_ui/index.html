<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Vite replaces env placeholders like VITE_SITE_NAME / VITE_ASSETS_URL -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>%VITE_SITE_NAME%</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,300;0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;1,6..12,400&display=swap"
      rel="stylesheet"
    />
    <!-- Avenir is preferred when installed locally; Nunito Sans is the web fallback -->

    <!-- <link href="%VITE_ASSETS_URL%/css/bootstrap.min.css" rel="stylesheet"> -->
    <!-- <link href="%VITE_ASSETS_URL%/css/bootstrap.rtl.min.css" rel="stylesheet"> -->
    <link
      rel="stylesheet"
      type="text/css"
      href="/css/owl.carousel.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="/css/font-awesome.min.css"
    />

    <script
      type="text/javascript"
      src="/js/jquery-3.2.1.min.js"
    ></script>
    <script
      type="text/javascript"
      src="/js/owl.carousel.min.js"
    ></script>

    <link href="/css/easyzoom.css" rel="stylesheet" />
    <!-- Theme CSS (plain public files; App.js may swap bootstrap LTR/RTL) -->
    <link id="theme-style" href="/css/style.css" rel="stylesheet" />
    <link id="theme-media-style" href="/css/media_style.css" rel="stylesheet" />
    <link id="theme-bootstrap" href="/css/bootstrap.min.css" rel="stylesheet" />

    <script
      type="text/javascript"
      src="/js/jquery.mCustomScrollbar.concat.min.js"
    ></script>
    <link
      href="/css/jquery.mCustomScrollbar.min.css"
      rel="stylesheet"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
      crossorigin="anonymous"
    ></script>

    <script
      type="text/javascript"
      src="/js/easyzoom.js"
    ></script>
  </head>
  <body>
    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: "470670582169015",
          xfbml: true,
          version: "v20.0",
        });
      };
    </script>
    <script
      async
      defer
      crossorigin="anonymous"
      src="https://connect.facebook.net/en_US/sdk.js"
    ></script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
