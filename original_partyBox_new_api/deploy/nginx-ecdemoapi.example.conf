# Place/adapt under /etc/nginx/sites-available/ecdemoapi
# CRITICAL: proxy_pass port MUST match API .env PORT (yours is currently 3000).

server {
    listen 80;
    server_name ecdemoapi.indiprotechnologies.com;
    # SSL termination may be handled elsewhere — keep your existing SSL block.

    client_max_body_size 50M;

    location / {
        # If Node is down, nginx 502 has no CORS headers → browser shows "CORS error".
        # proxy_pass MUST match /var/www/html/api/.env PORT
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass CORS preflight through to Node (do not answer OPTIONS here unless needed)
        proxy_pass_request_headers on;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
